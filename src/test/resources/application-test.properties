# ---- Test 数据源（覆盖 main 的 MySQL，使用 H2 内存库；@ActiveProfiles("test") 生效） ----
spring.datasource.url=jdbc:h2:mem:examxx;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# ---- MyBatis（同上） ----
mybatis.mapper-locations=classpath:com/extr/persistence/*.xml
mybatis.type-aliases-package=com.extr.domain
mybatis.configuration.map-underscore-to-camel-case=false

# ---- 上传目录 ----
examxx.upload-dir=${EXAMXX_UPLOAD_DIR:./uploads}