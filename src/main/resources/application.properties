# ---- 服务 ----
server.port=${EXAMXX_PORT:8080}
server.servlet.session.timeout=120m

# ---- 数据源（兼容原 EXAMXX_DB_* 环境变量） ----
spring.datasource.url=${EXAMXX_DB_URL:jdbc:mysql://localhost:3306/examxx?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&sslMode=DISABLED&allowPublicKeyRetrieval=true}
spring.datasource.username=${EXAMXX_DB_USER:root}
spring.datasource.password=${EXAMXX_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- MyBatis ----
mybatis.mapper-locations=classpath:com/extr/persistence/*.xml
mybatis.type-aliases-package=com.extr.domain
mybatis.configuration.map-underscore-to-camel-case=false

# ---- 上传目录（WebConfig 读取 ${examxx.upload-dir}，并映射 /files/**） ----
examxx.upload-dir=${EXAMXX_UPLOAD_DIR:./uploads}

# ---- 文件上传大小（原 20MB） ----
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB